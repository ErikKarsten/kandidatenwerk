name: Kampagnen-Automatisierungen

on:
  # Kein Zeitplan mehr: läuft seit 02.10.2026 regulär per Cloudflare Cron Trigger
  # (custom-worker.ts, wrangler.jsonc "triggers.crons"), da GitHub den Cron hier nur
  # alle 3-6 Stunden statt im geplanten Takt ausgeführt hat. Bleibt als manueller
  # Notfall-Start erhalten.
  workflow_dispatch: {}

jobs:
  run-automations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Automatisierungen ausführen
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: npx tsx scripts/run-automations.ts
