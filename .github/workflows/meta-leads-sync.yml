name: Meta-Leads-Sync

on:
  schedule:
    # Alle 30 Minuten - deutlich häufiger als der tägliche Leadtable-Sync, da Meta hier
    # (Stand jetzt: Parallelphase) die primäre, zeitkritischere Quelle werden soll.
    # Intervall kann bei Bedarf angepasst werden (z.B. auf stündlich "0 * * * *").
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Meta-Leads-Sync ausführen
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/meta-leads-sync.ts
