name: Duplettenprüfung
on:
  schedule:
    # Einmal täglich, Ziel morgens. Bis 02.10.2026 gab es hier einen "7-Uhr-Check", der
    # nur bei Start um genau 7 Uhr deutscher Zeit prüfte - GitHub startet geplante Läufe
    # aber oft Stunden später, die Prüfung wurde dadurch an 7 von 7 Tagen übersprungen.
    # Jetzt ohne Stunden-Sperre: ein Lauf pro Tag, egal wann GitHub ihn startet.
    - cron: "0 5 * * *"
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Duplettenprüfung ausführen
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: npx tsx scripts/duplicate-check.ts
