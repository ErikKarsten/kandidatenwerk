name: Leadtable Full-Sync

on:
  schedule:
    # 6:00 Uhr deutscher Zeit - GitHub Actions kennt nur UTC, und die Verschiebung
    # ändert sich durch die Sommerzeit. Deshalb zwei Cron-Einträge:
    #   05:00 UTC = 06:00 MEZ (Winterzeit, UTC+1, ca. Ende Okt. - Ende März)
    #   04:00 UTC = 06:00 MESZ (Sommerzeit, UTC+2, ca. Ende März - Ende Okt.)
    # Der "6-Uhr-Check"-Schritt unten sorgt dafür, dass nur der jeweils gerade
    # passende der beiden Läufe tatsächlich synct - der andere überspringt sich selbst.
    - cron: "0 5 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 6-Uhr-Check (Sommer-/Winterzeit-Ausgleich)
        id: time_check
        run: |
          HOUR=$(TZ=Europe/Berlin date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "06" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Aktuelle deutsche Stunde: $HOUR - kein 6-Uhr-Lauf, wird übersprungen."
          fi
      - name: Checkout
        if: steps.time_check.outputs.should_run == 'true'
        uses: actions/checkout@v4
      - name: Node einrichten
        if: steps.time_check.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten installieren
        if: steps.time_check.outputs.should_run == 'true'
        run: npm ci
      - name: Leadtable Full-Sync ausführen
        if: steps.time_check.outputs.should_run == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          LEADTABLE_API_KEY: ${{ secrets.LEADTABLE_API_KEY }}
          LEADTABLE_ACCOUNT_EMAIL: ${{ secrets.LEADTABLE_ACCOUNT_EMAIL }}
        run: npx tsx scripts/leadtable-full-sync.ts
